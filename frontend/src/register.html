<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSplit - Register</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">UniSplit</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html"class="active">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html" >Add Expense</a>
            <a href="insights.html">Expense Insights</a>
            <a href="membership.html">Membership Purchase</a>
            <a href="history.html">Transaction History</a>
            <a href="report.html">Reports</a>
        </div>
    </nav>

    <main class="container">
        <h1>Create Account</h1>
        <form class="form-card" id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password">

            <p id="errorMsg" style="color:red;"></p>
            <button type="submit" class="btn">Register</button>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </main>

    <script src="./js/app.js?v=10"></script>
    <script>
        const currentUser = window.UniSplitApp.ensureAuthBanner({
            title: 'Registration status',
            loginHref: 'login.html',
            dashboardHref: 'dashboard.html'
        });
        if (currentUser) {
            document.getElementById('errorMsg').textContent = `You are already signed in as ${window.UniSplitApp.getUserDisplayName(currentUser)}.`;
            document.getElementById('errorMsg').style.color = '#8ff0b0';
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch(window.UniSplitApp.apiUrl('/api/register'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await res.json();
            if (res.ok) {
                window.UniSplitApp.setCurrentUser(data);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').textContent = data.error;
            }
        });
    </script>
</body>
</html>
