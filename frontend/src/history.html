<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSplit - History</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">UniSplit</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html" >Add Expense</a>
            <a href="insights.html">Expense Insights</a>
            <a href="membership.html">Membership Purchase</a>
            <a href="history.html"class="active">Transaction History</a>
            <a href="report.html">Reports</a>
        </div>
    </nav>

    <main class="container">
        <section class="page-header-card">
            <span class="hero-badge">Transactions & Records</span>
            <h1>Expense history</h1>
            <p>Review past shared expenses, filter records, and track settlement activity.</p>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Filters</h2>
            </div>

            <div class="history-filter-grid">
                <div class="input-group">
                    <label for="searchInput">Search</label>
                    <input type="text" id="searchInput" placeholder="Search description, payer, group...">
                </div>

                <div class="input-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Housing">Housing</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="groupFilter">Group</label>
                    <input type="text" id="groupFilter" placeholder="Roommates / NYC Trip">
                </div>

                <div class="input-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-full" id="applyFilterBtn">Apply Filters</button>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Transaction List</h2>
                <a href="add_expense.html">+ Add new expense</a>
            </div>

            <p id="historyMessage" class="error-message"></p>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>

    <script src="./js/app.js"></script>
    <script>
        const historyList = document.getElementById('historyList');
        const historyMessage = document.getElementById('historyMessage');

        function formatAmount(amount) {
            const num = Number(amount || 0);
            return `$${num.toFixed(2)}`;
        }

        function renderHistoryItem(item) {
            return `
                <div class="history-item">
                    <div class="history-main">
                        <div class="history-top-row">
                            <h3>${item.description || 'Untitled Expense'}</h3>
                            <span class="history-amount">${formatAmount(item.amount)}</span>
                        </div>
                        <div class="history-meta">
                            <span>Category: ${item.category || 'Other'}</span>
                            <span>Group: ${item.group_name || 'N/A'}</span>
                            <span>Paid by: ${item.payer || 'Unknown'}</span>
                            <span>Date: ${item.date || 'N/A'}</span>
                        </div>
                        <p class="history-notes">${item.notes || ''}</p>
                    </div>
                </div>
            `;
        }

        async function loadHistory() {
            historyMessage.textContent = '';
            historyList.innerHTML = '<div class="panel"><p>Loading history...</p></div>';

            const search = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('categoryFilter').value;
            const group = document.getElementById('groupFilter').value.trim();

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (category) params.append('category', category);
            if (group) params.append('group_name', group);

            try {
                const res = await fetch(`${window.UniSplitApp.apiUrl('/api/expenses')}?${params.toString()}`);
                const data = await res.json();

                if (!res.ok) {
                    historyList.innerHTML = '';
                    historyMessage.textContent = data.error || 'Failed to load transaction history.';
                    return;
                }

                const records = window.UniSplitApp.normalizeExpenseList(data);

                if (!records.length) {
                    historyList.innerHTML = `
                        <div class="empty-state-card">
                            <h3>No transactions found</h3>
                            <p>Try changing your filters or add a new expense.</p>
                        </div>
                    `;
                    return;
                }

                historyList.innerHTML = records.map(renderHistoryItem).join('');
            } catch (error) {
                historyList.innerHTML = '';
                historyMessage.textContent = 'Could not connect to the server.';
            }
        }

        document.getElementById('applyFilterBtn').addEventListener('click', loadHistory);

        window.addEventListener('DOMContentLoaded', () => {
            const successMsg = localStorage.getItem('expenseSuccess');
            if (successMsg) {
                historyMessage.style.color = '#8ff0b0';
                historyMessage.textContent = successMsg;
                localStorage.removeItem('expenseSuccess');
            }
            loadHistory();
        });
    </script>
</body>
</html>
