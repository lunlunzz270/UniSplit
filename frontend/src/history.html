<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSplit - History</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">UniSplit</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html" >Add Expense</a>
            <a href="insights.html">Expense Insights</a>
            <a href="billing.html">Billing</a>
            <a href="history.html"class="active">Transaction History</a>
            <a href="report.html">Reports</a>
        </div>
    </nav>

    <main class="container">
        <section class="page-header-card">
            <span class="hero-badge" id="historyScopeBadge">User view</span>
            <h1 id="historyTitle">Expense history</h1>
            <p id="historyDescription">Review past shared expenses, filter records, and track settlement activity.</p>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Filters</h2>
            </div>

            <div class="history-filter-grid">
                <div class="input-group">
                    <label for="searchInput">Search</label>
                    <input type="text" id="searchInput" placeholder="Search description, payer, email, group...">
                </div>

                <div class="input-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                        <option value="food_dining">Food & Dining</option>
                        <option value="transportation">Transportation</option>
                        <option value="groceries">Groceries</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="groupFilter">Group</label>
                    <input type="text" id="groupFilter" placeholder="Roommates / NYC Trip">
                </div>

                <div class="input-group">
                    <label>&nbsp;</label>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn btn-full" id="applyFilterBtn" type="button">Apply Filters</button>
                        <button class="btn btn-full" id="exportCsvBtn" type="button" style="background:#10b981;">Export CSV</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Transaction List</h2>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="page-ctrl-mini" style="display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px;">
                        <button id="prevBtn" class="btn-secondary" style="background:none; border:none; color:var(--primary-2); cursor:pointer; font-weight:bold;">&lt;</button>
                        <span id="pageDisplay" style="font-size:12px; color:var(--muted);">Page 1</span>
                        <button id="nextBtn" class="btn-secondary" style="background:none; border:none; color:var(--primary-2); cursor:pointer; font-weight:bold;">&gt;</button>
                    </div>
                    <a href="add_expense.html">+ Add new expense</a>
                </div>
            </div>

            <p id="historyMessage" class="inline-status" aria-live="polite"></p>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>

    <script src="./js/app.js?v=19"></script>
    <script>
        const historyList = document.getElementById('historyList');
        const historyMessage = document.getElementById('historyMessage');
        const historyScopeBadge = document.getElementById('historyScopeBadge');
        const historyTitle = document.getElementById('historyTitle');
        const historyDescription = document.getElementById('historyDescription');
        const searchInput = document.getElementById('searchInput');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageDisplay = document.getElementById('pageDisplay');
        const exportCsvBtn = document.getElementById('exportCsvBtn');

        let currentOffset = 0;
        const PAGE_LIMIT = 10;

        const currentUser = window.UniSplitApp.ensureAuthBanner({
            title: 'History access',
            requireLogin: true,
            loginHref: 'login.html',
            dashboardHref: 'dashboard.html'
        });

        function formatAmount(amount) {
            const num = Number(amount || 0);
            return `$${num.toFixed(2)}`;
        }

        function formatCategory(cat) {
            const map = {
                'food_dining': 'Food & Dining',
                'transportation': 'Transportation',
                'groceries': 'Groceries',
                'entertainment': 'Entertainment',
                'other': 'Other'
            };
            return map[cat] || (cat ? cat.charAt(0).toUpperCase() + cat.slice(1).replace('_', ' ') : 'Other');
        }

        function setHistoryMessage(message, kind = 'error') {
            historyMessage.className = `inline-status ${kind}`;
            historyMessage.textContent = message;
            if (!message) {
                historyMessage.className = 'inline-status';
            }
        }

        function updateHistoryContext() {
            if (currentUser?.is_admin) {
                historyScopeBadge.textContent = 'Administrator view';
                historyTitle.textContent = 'System expense history';
                historyDescription.textContent = 'Audit all accessible expenses, sort by group or payer, and act on disputes.';
                searchInput.placeholder = 'Search expenses across users, groups, and descriptions...';
            } else {
                historyScopeBadge.textContent = 'User view';
                historyTitle.textContent = 'My expense history';
                historyDescription.textContent = 'Review expenses you created or joined, filter by group, and follow settlement progress.';
                searchInput.placeholder = 'Search description, payer, email, group...';
            }
        }

        function renderHistoryItem(item) {
            const currentUser = window.UniSplitApp.getCurrentUser();
            const meAsParticipant = item.participants.find(p => p.user_id === currentUser.id);
            
            let actionButtons = '';
            let statusLabel = '';

            if (meAsParticipant) {
                if (meAsParticipant.status === 'pending') {
                    statusLabel = '<span class="status warning">Pending Action</span>';
                    actionButtons = `
                        <div class="button-row" style="margin-top: 10px;">
                            <button class="btn btn-small" onclick="handleResponse(${item.id}, 'accepted')">Accept</button>
                            <button class="btn-secondary btn-small" onclick="handleAppeal(${item.id})">Appeal</button>
                        </div>
                    `;
                } else if (meAsParticipant.status === 'accepted') {
                    statusLabel = '<span class="status warning">Awaiting Payment</span>';
                    actionButtons = `
                        <div class="button-row" style="margin-top: 10px;">
                            <button class="btn btn-small" onclick="handlePay(${item.group_id}, ${item.id}, ${item.payer_id || 0}, ${meAsParticipant.share})">Pay Now (${formatAmount(meAsParticipant.share)})</button>
                        </div>
                    `;
                } else if (meAsParticipant.status === 'rejected') {
                    statusLabel = '<span class="status error">Appealed</span>';
                    actionButtons = `
                        <p style="font-size:0.85em; opacity:0.8; margin-bottom:8px;">Reason: ${meAsParticipant.appeal_reason || 'No reason provided'}</p>
                        <div class="button-row">
                            <button class="btn btn-small" onclick="handleResponse(${item.id}, 'accepted')">Re-Accept</button>
                        </div>
                    `;
                } else if (meAsParticipant.status === 'paid' || meAsParticipant.is_settled) {
                    statusLabel = '<span class="status positive">Paid</span>';
                }
            } else if (item.payer_id === currentUser.id) {
                statusLabel = '<span class="status positive">You Paid</span>';
            }

            return `
                <div class="history-item">
                    <div class="history-main">
                        <div class="history-top-row">
                            <h3>${item.description || 'Untitled Expense'}</h3>
                            <div style="display:flex; align-items:center; gap:10px;">
                                ${statusLabel}
                                <span class="history-amount">${formatAmount(item.amount)}</span>
                            </div>
                        </div>
                        <div class="history-meta">
                            <span>Category: ${formatCategory(item.category)}</span>
                            <span>Group: ${item.group_name || 'N/A'}</span>
                            <span>Paid by: ${item.payer || 'Unknown'}</span>
                            <span>Date: ${item.date || 'N/A'}</span>
                        </div>
                        <div class="participants-list" style="margin-top:12px; padding:10px; background: rgba(255,255,255,0.05); border-radius:8px;">
                            <strong style="display:block; margin-bottom:6px; font-size:0.95em;">Split Details:</strong>
                            <div style="display:grid; gap:8px;">
                                ${item.participants.map(p => {
                                    let badge = '';
                                    let reasonText = '';
                                    let payerAction = '';

                                    if (p.status === 'paid' || p.is_settled) {
                                        badge = '<span class="status positive" style="font-size:0.8em; padding:2px 6px;">Paid</span>';
                                    } else if (p.status === 'rejected') {
                                        badge = '<span class="status error" style="font-size:0.8em; padding:2px 6px;">Appealed</span>';
                                        reasonText = `<div style="font-size:0.85em; color:#ff9d9d; margin-top:2px;">Reason: ${p.appeal_reason || 'No message'}</div>`;
                                        
                                        // If I am the payer, show Acknowledge button
                                        if (item.payer_id === currentUser.id) {
                                            payerAction = `<button class="btn btn-tiny" style="margin-top:4px;" onclick="handleResolveAppeal(${item.id}, ${p.user_id}, 'acknowledge')">Acknowledge</button>`;
                                        }
                                    } else if (p.status === 'appealed_acknowledged') {
                                        badge = '<span class="status warning" style="font-size:0.8em; padding:2px 6px;">Acknowledged</span>';
                                        reasonText = `<div style="font-size:0.85em; opacity:0.9; margin-top:2px; color: #ffcc00;">Appeal Acknowledged by Payer</div>`;
                                    } else if (p.status === 'accepted') {
                                        badge = '<span class="status warning" style="font-size:0.8em; padding:2px 6px;">Accepted</span>';
                                    } else {
                                        badge = '<span class="status" style="font-size:0.8em; padding:2px 6px; opacity:0.6;">Pending</span>';
                                    }

                                    return `
                                        <div style="display:flex; flex-direction:column; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:4px;">
                                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                                <span style="font-size:0.9em;">${p.name} (${p.email || 'N/A'})</span>
                                                <div style="display:flex; align-items:center; gap:8px;">
                                                    <span style="font-weight:bold; font-size:0.9em;">${formatAmount(p.share)}</span>
                                                    ${badge}
                                                </div>
                                            </div>
                                            ${reasonText}
                                            ${payerAction}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        ${actionButtons}
                    </div>
                </div>
            `;
        }

        async function handleResolveAppeal(expenseId, participantUserId, action) {
            const sessionToken = window.UniSplitApp.getCurrentSessionToken();
            try {
                const res = await fetch(window.UniSplitApp.apiUrl(`/api/expenses/${expenseId}/resolve_appeal`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${sessionToken}`,
                        'X-Session-Token': sessionToken,
                    },
                    body: JSON.stringify({ participant_id: participantUserId, action: action }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.error) {
                    setHistoryMessage(data.error || 'Unable to resolve appeal.');
                    return;
                }
                setHistoryMessage(data.message || 'Appeal updated.', 'success');
                await loadHistory();
            } catch (e) {
                setHistoryMessage('Network error while resolving appeal.');
            }
        }

        async function handleResponse(expenseId, status) {
            const res = await window.UniSplitApp.respondToExpense(expenseId, status);
            if (res.error) {
                setHistoryMessage(res.error);
            } else {
                setHistoryMessage('Response saved.', 'success');
                await loadHistory();
            }
        }

        async function handleAppeal(expenseId) {
            const reason = prompt("Enter your reason for appeal:");
            if (reason === null) return;
            const res = await window.UniSplitApp.respondToExpense(expenseId, 'rejected', reason);
            if (res.error) {
                setHistoryMessage(res.error);
            } else {
                setHistoryMessage('Appeal submitted.', 'success');
                await loadHistory();
            }
        }

        async function handlePay(groupId, expenseId, payeeId, amount) {
            if (!confirm(`Confirm payment of $${amount}?`)) return;
            const res = await window.UniSplitApp.payExpense(groupId, expenseId, payeeId, amount);
            if (res.error) {
                setHistoryMessage(res.error);
            } else {
                setHistoryMessage('Payment successful.', 'success');
                await loadHistory();
            }
        }

        async function exportHistoryCsv() {
            if (!currentUser) {
                setHistoryMessage('Please log in to export transaction history.');
                return;
            }

            const search = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('categoryFilter').value;
            const group = document.getElementById('groupFilter').value.trim();

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (category) params.append('category', category);
            if (group) params.append('group_name', group);

            try {
                exportCsvBtn.disabled = true;
                exportCsvBtn.textContent = 'Exporting...';

                const response = await window.UniSplitApp.apiFetch(`/api/expenses/export?${params.toString()}`);
                const start = search || category || group ? 'filtered' : 'all';
                await window.UniSplitApp.downloadResponseAsFile(
                    response,
                    `unisplit-history-${start}.csv`
                );
                setHistoryMessage('CSV export downloaded.', 'success');
            } catch (error) {
                setHistoryMessage(error.message || 'Unable to export transaction history.');
            } finally {
                exportCsvBtn.disabled = false;
                exportCsvBtn.textContent = 'Export CSV';
            }
        }

        async function loadHistory() {
            if (!currentUser) {
                setHistoryMessage('Please log in to view transaction history.');
                historyList.innerHTML = '<div class="empty-state-card"><h3>Login required</h3><p>Sign in to see your shared expense history.</p></div>';
                return;
            }

            setHistoryMessage('');
            historyList.innerHTML = '<div class="panel"><p>Loading history...</p></div>';

            const search = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('categoryFilter').value;
            const group = document.getElementById('groupFilter').value.trim();

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (category) params.append('category', category);
            if (group) params.append('group_name', group);
            params.append('limit', PAGE_LIMIT);
            params.append('offset', currentOffset);

            try {
                const res = await window.UniSplitApp.apiFetch(`/api/expenses?${params.toString()}`);
                const data = await res.json();

                if (!res.ok) {
                    historyList.innerHTML = '';
                    setHistoryMessage(data.error || 'Failed to load transaction history.');
                    return;
                }

                const records = window.UniSplitApp.normalizeExpenseList(data);

                if (!records.length) {
                    historyList.innerHTML = `
                        <div class="empty-state-card">
                            <h3>No transactions found</h3>
                            <p>Try changing your filters or add a new expense.</p>
                        </div>
                    `;
                    nextBtn.disabled = true;
                    return;
                }

                historyList.innerHTML = records.map(renderHistoryItem).join('');
                
                // Update Pagination UI
                pageDisplay.textContent = `Page ${Math.floor(currentOffset / PAGE_LIMIT) + 1}`;
                prevBtn.disabled = currentOffset <= 0;
                nextBtn.disabled = records.length < PAGE_LIMIT;

            } catch (error) {
                historyList.innerHTML = '';
                setHistoryMessage('Could not connect to the server.');
            }
        }

        document.getElementById('applyFilterBtn').addEventListener('click', () => {
            currentOffset = 0;
            loadHistory();
        });

        exportCsvBtn.addEventListener('click', exportHistoryCsv);

        prevBtn.addEventListener('click', () => {
            if (currentOffset > 0) {
                currentOffset -= PAGE_LIMIT;
                loadHistory();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentOffset += PAGE_LIMIT;
            loadHistory();
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateHistoryContext();
            const successMsg = localStorage.getItem('expenseSuccess');
            if (successMsg) {
                setHistoryMessage(successMsg, 'success');
                localStorage.removeItem('expenseSuccess');
            }
            loadHistory();
        });
    </script>
</body>
</html>
