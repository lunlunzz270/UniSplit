<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSplit - Reminders</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">UniSplit</div>
        <div class="nav-links"></div>
    </nav>

    <main class="container">
        <section class="page-header-card">
            <span class="hero-badge">Shared balance reminders</span>
            <h1>Reminders</h1>
            <p>Send a reminder to a group member and review reminders for a group.</p>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Send Reminder</h2>
                <span id="reminderStatus" class="status neutral">Loading</span>
            </div>

            <form id="reminderForm" class="form-card">
                <div class="input-group">
                    <label for="groupSelect">Group</label>
                    <select id="groupSelect"></select>
                </div>
                <div class="input-group">
                    <label for="recipientSelect">Recipient</label>
                    <select id="recipientSelect"></select>
                </div>
                <div class="input-group" id="expenseSelectGroup" style="display: none;">
                    <label for="expenseSelect">Link to Bill (Optional)</label>
                    <select id="expenseSelect">
                        <option value="">Select an unsettled bill</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="reminderMessage">Message</label>
                    <textarea id="reminderMessage" placeholder="Please settle your balance."></textarea>
                </div>
                <p id="reminderMessageBox" class="error-message"></p>
                <button type="submit" class="btn">Send reminder</button>
            </form>
        </section>

        <section class="panel" style="margin-top: 20px;">
            <div class="panel-header">
                <h2>Reminder History</h2>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="page-ctrl-mini" style="display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px;">
                        <button id="prevRemBtn" class="btn-secondary" style="background:none; border:none; color:var(--primary-2); cursor:pointer; font-weight:bold;">&lt;</button>
                        <span id="remPageDisplay" style="font-size:12px; color:var(--muted);">Page 1</span>
                        <button id="nextRemBtn" class="btn-secondary" style="background:none; border:none; color:var(--primary-2); cursor:pointer; font-weight:bold;">&gt;</button>
                    </div>
                    <button id="refreshReminders" class="btn-secondary" type="button">Refresh</button>
                </div>
            </div>
            <div id="reminderList" class="history-list"></div>
        </section>
    </main>

    <script src="./js/app.js?v=22"></script>
    <script>
        const currentUser = window.UniSplitApp.ensureAuthBanner({
            title: 'Reminder access',
            requireLogin: true,
            loginHref: 'login.html',
            dashboardHref: 'dashboard.html'
        });

        const reminderStatus = document.getElementById('reminderStatus');
        const reminderList = document.getElementById('reminderList');
        const reminderMessageBox = document.getElementById('reminderMessageBox');
        const groupSelect = document.getElementById('groupSelect');
        const recipientSelect = document.getElementById('recipientSelect');
        const expenseSelect = document.getElementById('expenseSelect');
        const expenseSelectGroup = document.getElementById('expenseSelectGroup');
        const prevRemBtn = document.getElementById('prevRemBtn');
        const nextRemBtn = document.getElementById('nextRemBtn');
        const remPageDisplay = document.getElementById('remPageDisplay');

        let remOffset = 0;
        const PAGE_LIMIT = 10;

        function escapeHtml(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function renderReminder(item) {
            const dateStr = item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A';
            return `
                <div class="history-item">
                    <div class="history-main">
                        <div class="history-top-row">
                            <h3>Settlement Reminder</h3>
                            <span style="font-size: 0.8em; opacity: 0.5;">ID: #${item.id}</span>
                        </div>
                        <div class="history-meta">
                            <span><strong>Group:</strong> ${escapeHtml(item.group_name)}</span>
                            <span><strong>Sender:</strong> ${escapeHtml(item.sender_name)} <small>(${escapeHtml(item.sender_email)})</small></span>
                            <span><strong>Recipient:</strong> ${escapeHtml(item.recipient_name)} <small>(${escapeHtml(item.recipient_email)})</small></span>
                            ${item.expense_id ? `<span><strong>Bill:</strong> ${escapeHtml(item.expense_title)}</span>` : ''}
                            <span><strong>Date:</strong> ${dateStr}</span>
                        </div>
                        <div style="margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 6px; border-left: 3px solid var(--primary-2);">
                            <p class="history-notes" style="margin: 0; font-style: italic;">"${escapeHtml(item.message)}"</p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadGroups() {
            if (!currentUser) return;
            const res = await window.UniSplitApp.apiFetch(`/api/users/${currentUser.id}/groups`);
            const data = await res.json();
            const groups = data.groups || [];
            groupSelect.innerHTML = groups.map((group) => `<option value="${group.id}">${escapeHtml(group.name)} (#${group.id})</option>`).join('');
            if (!groups.length) {
                groupSelect.innerHTML = '<option value="">No groups found</option>';
                recipientSelect.innerHTML = '<option value="">No group members</option>';
                recipientSelect.disabled = true;
                reminderList.innerHTML = '<div class="empty-state-card"><p>Select a group to view reminders.</p></div>';
                return;
            }

            groupSelect.value = groupSelect.value || groups[0].id;
            await loadRecipients();
            await loadReminders();
        }

        async function loadRecipients() {
            const groupId = groupSelect.value;
            if (!groupId) {
                recipientSelect.innerHTML = '<option value="">Select a group first</option>';
                recipientSelect.disabled = true;
                return;
            }

            const res = await window.UniSplitApp.apiFetch(`/api/groups/${groupId}/members`);
            const data = await res.json();
            const members = (data.members || []).filter((member) => Number(member.user_id) !== Number(currentUser.id));

            if (!res.ok) {
                recipientSelect.innerHTML = '<option value="">Failed to load members</option>';
                recipientSelect.disabled = true;
                reminderMessageBox.textContent = data.error || 'Failed to load group members.';
                return;
            }

            if (!members.length) {
                recipientSelect.innerHTML = '<option value="">No other members found</option>';
                recipientSelect.disabled = true;
                return;
            }

            recipientSelect.disabled = false;
            recipientSelect.innerHTML = [
                '<option value="">Select a recipient</option>',
                ...members.map((member) => {
                    const labelParts = [
                        escapeHtml(member.full_name || `User ${member.user_id}`),
                        member.email ? `(${escapeHtml(member.email)})` : '',
                        `#${member.user_id}`,
                    ].filter(Boolean);
                    return `<option value="${member.user_id}">${labelParts.join(' ')}</option>`;
                }),
            ].join('');
            
            // Clear expenses when recipient list changes
            expenseSelectGroup.style.display = 'none';
            expenseSelect.innerHTML = '<option value="">Select an unsettled bill</option>';
        }

        async function loadUnsettledExpenses() {
            const groupId = groupSelect.value;
            const recipientId = recipientSelect.value;
            const sendBtn = document.querySelector('#reminderForm button[type="submit"]');
            
            // Reset to default state
            expenseSelectGroup.style.display = 'none';
            expenseSelect.innerHTML = '<option value="">Select an unsettled bill</option>';
            sendBtn.disabled = false;
            reminderMessageBox.textContent = '';

            if (!groupId || !recipientId) {
                return;
            }

            try {
                const res = await window.UniSplitApp.apiFetch(`/api/groups/${groupId}/reminders/unsettled-expenses?recipient_id=${recipientId}`);
                const data = await res.json();
                const expenses = data.expenses || [];

                if (expenses.length > 0) {
                    expenseSelectGroup.style.display = 'block';
                    expenseSelect.innerHTML = [
                        '<option value="">Apply to ALL unsettled bills</option>',
                        ...expenses.map(e => `<option value="${e.id}">${escapeHtml(e.description)} ($${Number(e.amount).toFixed(2)})</option>`)
                    ].join('');
                } else {
                    // NO debt found: Block the action
                    expenseSelectGroup.style.display = 'none';
                    reminderMessageBox.style.color = '#ffb3b3';
                    reminderMessageBox.textContent = 'This member has no unsettled debt to you. Reminder disabled.';
                    sendBtn.disabled = true;
                }
            } catch (e) {
                console.error("Failed to load unsettled expenses", e);
            }
        }

        async function loadReminders() {
            const groupId = groupSelect.value;
            if (!groupId) {
                reminderList.innerHTML = '<div class="empty-state-card"><p>Select a group to view reminders.</p></div>';
                return;
            }
            const res = await window.UniSplitApp.apiFetch(`/api/groups/${groupId}/reminders?limit=${PAGE_LIMIT}&offset=${remOffset}`);
            const data = await res.json();
            const reminders = data.reminders || [];
            if (!reminders.length) {
                if (remOffset === 0) {
                    reminderList.innerHTML = '<div class="empty-state-card"><p>No reminders yet.</p></div>';
                } else {
                    reminderList.innerHTML = '<div class="empty-state-card"><p>No more reminders.</p></div>';
                }
                nextRemBtn.disabled = true;
                return;
            }
            reminderList.innerHTML = reminders.map(renderReminder).join('');

            // Update Pagination UI
            remPageDisplay.textContent = `Page ${Math.floor(remOffset / PAGE_LIMIT) + 1}`;
            prevRemBtn.disabled = remOffset <= 0;
            nextRemBtn.disabled = reminders.length < PAGE_LIMIT;
        }

        document.getElementById('reminderForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            reminderMessageBox.style.color = '#ffb3b3';
            reminderMessageBox.textContent = '';
            
            const groupId = groupSelect.value;
            const recipientIdVal = recipientSelect.value;
            const message = document.getElementById('reminderMessage').value.trim();

            if (!groupId) {
                reminderMessageBox.textContent = 'Please select a group first.';
                return;
            }
            if (!recipientIdVal) {
                reminderMessageBox.textContent = 'Please select a recipient.';
                return;
            }
            if (!message) {
                reminderMessageBox.textContent = 'Please enter a message.';
                return;
            }

            const recipientId = Number(recipientIdVal);
            const expenseId = expenseSelect.value ? Number(expenseSelect.value) : null;

            const res = await window.UniSplitApp.apiFetch(`/api/groups/${groupId}/reminders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    recipient_id: recipientId, 
                    message: message, 
                    expense_id: expenseId 
                }),
            });
            
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                reminderMessageBox.style.color = '#ffb3b3';
                reminderMessageBox.textContent = data.error || 'Failed to send reminder.';
                return;
            }

            // SUCCESS
            document.getElementById('reminderMessage').value = '';
            reminderMessageBox.style.color = '#8ff0b0';
            reminderMessageBox.style.padding = '10px';
            reminderMessageBox.style.background = 'rgba(143, 240, 176, 0.1)';
            reminderMessageBox.style.borderRadius = '8px';
            reminderMessageBox.textContent = '✓ Reminder successfully sent to the member.';
            
            // Fallback for visual confirmation
            setTimeout(() => {
                alert('Success: Reminder sent!');
            }, 100);

            await loadReminders();
        });

        document.getElementById('refreshReminders').addEventListener('click', loadReminders);

        prevRemBtn.addEventListener('click', () => {
            if (remOffset > 0) {
                remOffset -= PAGE_LIMIT;
                loadReminders();
            }
        });

        nextRemBtn.addEventListener('click', () => {
            remOffset += PAGE_LIMIT;
            loadReminders();
        });

        groupSelect.addEventListener('change', async () => {
            remOffset = 0; // Reset pagination
            await loadRecipients();
            await loadReminders();
        });

        recipientSelect.addEventListener('change', async () => {
            await loadUnsettledExpenses();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            if (!currentUser) return;
            reminderStatus.textContent = `Signed in as ${window.UniSplitApp.getUserDisplayName(currentUser)}`;
            await loadGroups();
        });
    </script>
</body>
</html>
