<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSplit - Add Expense</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">UniSplit</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html">Add Expense</a>
            <a href="history.html">History</a>
            <a href="report.html">Report</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <main class="container">
        <h1>Add Expense</h1>
        <form class="form-card">
            <label>Description</label>
            <input type="text" placeholder="Dinner, groceries, Uber...">

            <label>Amount</label>
            <input type="number" placeholder="0.00">

            <label>Payer</label>
            <input type="text" placeholder="Who paid?">

            <label>Participants</label>
            <input type="text" placeholder="Enter participants">

            <button type="submit" class="btn">Add Expense</button>
        </form>
    </main>
</body>
</html>
