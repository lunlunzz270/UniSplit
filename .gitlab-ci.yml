workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

stages:
  - test
  - smoke
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

.python_job:
  image: python:3.11-slim
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - python --version
    - python -m pip install --upgrade pip

unit_tests:
  extends: .python_job
  stage: test
  script:
    - pip install -r backend/requirements.txt pytest
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

smoke_backend:
  extends: .python_job
  stage: smoke
  needs: ["unit_tests"]
  script:
    - pip install -r backend/requirements.txt
    - python .gitlab/ci/smoke_backend.py

deploy_staging:
  image: alpine:3.20
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_HOST && $DEPLOY_USER && $DEPLOY_SSH_KEY && $DEPLOY_PATH'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git pull && docker compose up -d --build"
